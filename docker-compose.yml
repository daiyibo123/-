name: handcraft-nn

services:
  app:
    build:
      context: .
    image: handcraft-nn:latest
    ports:
      - "${APP_PORT:-8800}:8800"
    environment:
      TUTOR_API_BASE: "${TUTOR_API_BASE:-https://open.bigmodel.cn/api/paas/v4/chat/completions}"
      TUTOR_API_KEY: "${TUTOR_API_KEY:-}"
      TUTOR_MODEL: "${TUTOR_MODEL:-glm-4-flash}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
